# AquaOS Hyprland configuration
# Water-inspired palette: deep blue, teal, cyan, glass panels

$bg_deep = rgb(4, 22, 35)
$bg_mid = rgb(9, 47, 66)
$bg_panel = rgba(9, 52, 74, 0.72)
$bg_panel_alt = rgba(14, 85, 109, 0.75)

$teal = rgb(72, 214, 255)
$cyan = rgb(125, 235, 255)
$ice = rgb(216, 247, 255)
$blue = rgb(18, 117, 163)
$muted = rgb(158, 210, 225)
$shadow = rgba(0, 0, 0, 0.45)

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(114, 224, 255, 1)
    col.inactive_border = rgba(18, 117, 163, 0.7)
    layout = dwindle
}

decoration {
    rounding = 14
    blur = yes
    blur_size = 7
    blur_passes = 2
    blur_new_optimizations = on

    drop_shadow = yes
    shadow_range = 20
    shadow_render_power = 3
    shadow_color = $shadow

    active_opacity = 1.0
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0
}

animations {
    enabled = yes

    bezier = aqua_curve, 0.05, 0.9, 0.1, 1.0

    animation = windows, 1, 7, aqua_curve
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 8, default
    animation = workspaces, 1, 7, aqua_curve
}

dwindle {
    pseudotile = yes
    preserve_split = yes
}

master {
    new_is_master = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0.0
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

monitor = ,preferred,auto,1

$mainMod = SUPER

bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, B, exec, firefox
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, F, fullscreen,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, SPACE, exec, rofi -show drun

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = opacity 0.96 0.92, class:^(firefox)$
windowrulev2 = opacity 0.96 0.92, class:^(kitty)$

exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = waybar
exec-once = nm-applet
exec-once = swaybg -i /usr/share/backgrounds/aquaos-water.jpg -m fill

env = XCURSOR_THEME, Bibata-Modern-Classic
env = XCURSOR_SIZE, 24
env = GTK_THEME, Adwaita-dark

exec-once = hyprctl setcursor Bibata-Modern-Classic 24
