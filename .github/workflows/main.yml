name: Build AcquaOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build AcquaOS ISO in privileged Fedora 45 container
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/build" \
            -w /build \
            fedora:45 \
            bash -euo pipefail -c '
              dnf install -y lorax lorax-lmc-novirt anaconda-tui pykickstart squashfs-tools xorriso git
              chmod +x fedora/build_fedora_iso.sh
              ./fedora/build_fedora_iso.sh
              ls -lh output/
            '
      - name: Fix output ownership
        if: always()
        run: sudo chown -R $(id -u):$(id -g) output 2>/dev/null || true
      - name: Upload ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AcquaOS-ISO
          path: output/*.iso
          if-no-files-found: error
          retention-days: 7
